<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAA PAY • PAKET DATA</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="paket.css">
</head>
<body>
    <!-- LOADING -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="loading-logo">
                <img src="https://i.ibb.co.com/1th4mGLz/1778855680928.jpg" alt="STAA PAY">
            </div>
            <div class="loading-spinner"></div>
            <div class="loading-text">MEMUAT OPERATOR...</div>
            <div class="loading-sub">STAA PAY • Paket Data</div>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-crown"></i>
                <span>STAA <span class="store-highlight">PAY</span></span>
            </a>
            <div class="nav-right">
                <a href="index.html" class="nav-item" title="Beranda">
                    <i class="fas fa-home"></i>
                </a>
                <button class="nav-item theme-toggle-nav" id="themeToggleNav" title="Ganti Tema">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- HEADER SEDERHANA -->
        <header class="page-header" data-aos="fade-up">
            <div class="page-header-left">
                <div class="page-header-icon">
                    <i class="fas fa-sim-card"></i>
                </div>
                <div class="page-header-text">
                    <span class="page-header-label">STAA PAY</span>
                    <h1>Paket Data</h1>
                    <p>Pilih operator untuk melihat paket tersedia</p>
                </div>
            </div>
            <div class="status-pill" id="storeStatus">
                <span class="status-dot"></span>
                <span>Memuat...</span>
            </div>
        </header>

        <!-- LIST OPERATOR -->
        <main>
            <div class="list-header" data-aos="fade-up" data-aos-delay="50">
                <span class="list-title"><i class="fas fa-tower-cell"></i> Operator</span>
                <span class="list-count" id="providerCount">--</span>
            </div>

            <div class="operator-list" id="providersList" data-aos="fade-up" data-aos-delay="100">
                <div class="loading-placeholder">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Memuat operator...</span>
                </div>
            </div>

            <!-- INFO MINI -->
            <div class="mini-info" data-aos="fade-up" data-aos-delay="150">
                <div class="mini-item">
                    <i class="fas fa-bolt"></i>
                    <span>Proses Cepat</span>
                </div>
                <div class="mini-item">
                    <i class="fas fa-shield-alt"></i>
                    <span>100% Aman</span>
                </div>
                <div class="mini-item">
                    <i class="fas fa-headset"></i>
                    <span>CS 24/7</span>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 <span id="footerNama">STAA PAY</span> &bull; Paket Data All Operator</p>
        </footer>
    </div>

    <!-- ============================================ -->
    <!-- POPUP PREMIUM — NOTIFIKASI PROFESIONAL        -->
    <!-- ============================================ -->
    <div class="popup-premium-overlay" id="popupPremium">
        <div class="popup-premium-card" id="popupCard">
            <button class="popup-premium-close" id="popupClose" aria-label="Tutup">
                <i class="fas fa-times"></i>
            </button>

            <div class="popup-premium-icon-wrapper">
                <div class="popup-premium-icon-ring"></div>
                <div class="popup-premium-icon" id="popupIcon">
                    <i class="fas fa-exclamation-triangle" id="popupIconInner"></i>
                </div>
            </div>

            <span class="popup-premium-badge" id="popupBadge">
                <i class="fas fa-circle"></i>
                <span id="popupBadgeText">Pemberitahuan</span>
            </span>

            <h3 class="popup-premium-title" id="popupTitle">Judul Popup</h3>
            <p class="popup-premium-message" id="popupMessage">Deskripsi pesan popup.</p>

            <div class="popup-premium-info" id="popupInfo">
                <div class="popup-premium-info-item">
                    <i class="fas fa-sim-card"></i>
                    <span id="popupOperator">Operator</span>
                </div>
            </div>

            <div class="popup-premium-actions">
                <button class="popup-btn popup-btn-secondary" id="popupCancel">
                    <i class="fas fa-times"></i> Tutup
                </button>
                <button class="popup-btn popup-btn-primary" id="popupWA">
                    <i class="fab fa-whatsapp"></i> Tanya Admin
                </button>
            </div>

            <div class="popup-premium-progress">
                <div class="popup-premium-progress-bar" id="popupProgressBar"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="paket.js"></script>
    <script src="inner.js"></script>
</body>
</html>
